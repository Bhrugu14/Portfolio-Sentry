services:
  # Production image. Default service — `docker compose up` runs this one.
  #   docker compose --env-file .env.local up --build
  app:
    build:
      context: .
      target: runner
      args:
        # Inlined into the client bundle at build time — see Dockerfile.
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.local
    ports:
      - '3000:3000'

  # Local dev with hot reload. Opt in with the `dev` profile:
  #   docker compose --env-file .env.local --profile dev up app-dev
  app-dev:
    build:
      context: .
      target: dev
    env_file:
      - .env.local
    environment:
      # Docker Desktop's bind-mount file events don't always reach the
      # container's watcher reliably (notably on macOS/Windows) — polling
      # is slightly heavier on CPU but makes hot reload actually fire.
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Anonymous volumes so the container's own installs/build cache aren't
      # shadowed by the bind mount above (host has neither, in general).
      - /app/node_modules
      - /app/.next
    profiles:
      - dev
